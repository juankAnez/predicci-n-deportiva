{% extends "base.html" %}

{% block title %}Comparativa - Predicción Deportiva{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1 class="h3"><i class="bi bi-arrow-left-right text-primary"></i> Comparativa de Equipos</h1>
    </div>
</div>

<div class="row g-3 mb-4">
    <div class="col-md-5">
        <select class="form-select form-select-lg" id="team1-select">
            <option value="">Seleccionar equipo local...</option>
        </select>
    </div>
    <div class="col-md-2 text-center">
        <h2 class="fw-bold text-muted">VS</h2>
    </div>
    <div class="col-md-5">
        <select class="form-select form-select-lg" id="team2-select">
            <option value="">Seleccionar equipo visitante...</option>
        </select>
    </div>
</div>

<div class="row g-3">
    <div class="col-md-7">
        <div class="card bg-dark border-secondary">
            <div class="card-header border-secondary">
                <h5 class="mb-0"><i class="bi bi-radioactive text-info"></i> Comparativa Radar</h5>
            </div>
            <div class="card-body">
                <canvas id="compareRadarChart"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-5">
        <div class="card bg-dark border-secondary">
            <div class="card-header border-secondary">
                <h5 class="mb-0"><i class="bi bi-table text-warning"></i> Estadísticas Comparativas</h5>
            </div>
            <div class="card-body" id="compare-stats">
                <p class="text-muted text-center">Selecciona dos equipos para comparar</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/charts.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        loadTeams();
    });
</script>
{% endblock %}
