{% extends "base.html" %}

{% block title %}Admin - Predicción Deportiva{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1 class="h3"><i class="bi bi-gear text-warning"></i> Panel de Administración</h1>
    </div>
</div>

<div class="row g-3 mb-4">
    <div class="col-md-4">
        <div class="card bg-dark border-primary h-100">
            <div class="card-header border-primary">
                <h5 class="mb-0"><i class="bi bi-database text-primary"></i> Scraping</h5>
            </div>
            <div class="card-body">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary" onclick="scrapeRankings()">
                        <i class="bi bi-arrow-up-circle"></i> Actualizar Rankings
                    </button>
                    <button class="btn btn-outline-info" onclick="scrapeWeather()">
                        <i class="bi bi-cloud-sun"></i> Actualizar Clima
                    </button>
                </div>
                <div id="scraping-result" class="mt-3"></div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card bg-dark border-success h-100">
            <div class="card-header border-success">
                <h5 class="mb-0"><i class="bi bi-cpu text-success"></i> Modelos</h5>
            </div>
            <div class="card-body">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-success" onclick="trainModels()">
                        <i class="bi bi-play-circle"></i> Entrenar Modelos
                    </button>
                    <button class="btn btn-outline-secondary" onclick="loadModelStatus()">
                        <i class="bi bi-info-circle"></i> Estado Modelos
                    </button>
                </div>
                <div id="model-result" class="mt-3"></div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card bg-dark border-danger h-100">
            <div class="card-header border-danger">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle text-danger"></i> Base de Datos</h5>
            </div>
            <div class="card-body">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-danger" onclick="initDatabase()">
                        <i class="bi bi-hdd-rack"></i> Inicializar DB
                    </button>
                </div>
                <div id="db-result" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card bg-dark border-secondary">
            <div class="card-header border-secondary d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-journal-text"></i> Logs de Scraping</h5>
                <button class="btn btn-sm btn-outline-secondary" onclick="refreshLogs()">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark table-striped mb-0">
                        <thead>
                            <tr>
                                <th>Fuente</th>
                                <th>Tipo</th>
                                <th>Estado</th>
                                <th>Items</th>
                                <th>Duración</th>
                                <th>Fecha</th>
                            </tr>
                        </thead>
                        <tbody id="logs-table-body">
                            <tr>
                                <td colspan="6" class="text-muted text-center">Cargando logs...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/dashboard.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        refreshLogs();
    });
</script>
{% endblock %}
