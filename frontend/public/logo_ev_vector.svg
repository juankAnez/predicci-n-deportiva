<svg xmlns="http://www.w3.org/2000/svg" width="603" height="597" viewBox="0 0 603 597">
  <defs>
    <linearGradient id="hexStroke" x1="125" y1="110" x2="486" y2="505" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12BFD0"/>
      <stop offset="1" stop-color="#18C47A"/>
    </linearGradient>
    <linearGradient id="arrowStroke" x1="295" y1="360" x2="415" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16C9C4"/>
      <stop offset="1" stop-color="#47D58C"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="603" height="597" fill="#030A16"/>

  <!-- subtle glow behind graphic -->
  <circle cx="303" cy="307" r="198" fill="#0CC997" opacity=".07"/>
  <circle cx="303" cy="307" r="184" fill="none" stroke="#0CC997" stroke-width="18" opacity=".035" filter="url(#softGlow)"/>

  <!-- main hexagon -->
  <polygon points="303,100 480,201 480,405 303,506 126,405 126,201"
           fill="#081123" stroke="url(#hexStroke)" stroke-width="6" stroke-linejoin="round"/>

  <!-- center guide axes -->
  <g stroke="#263047" stroke-width="3" stroke-dasharray="8 9" opacity=".75">
    <line x1="303" y1="104" x2="303" y2="503"/>
    <line x1="127" y1="303" x2="479" y2="303"/>
  </g>

  <!-- radar rings -->
  <g fill="none" stroke="#2A344B" stroke-width="4" stroke-dasharray="6 10" opacity=".72">
    <circle cx="303" cy="304" r="121"/>
    <polygon points="303,184 389,244 361,361 244,361 217,244"
             stroke="#43506A" stroke-width="5" stroke-dasharray="6 6" opacity=".9"/>
  </g>

  <!-- radar vertices -->
  <g>
    <circle cx="303" cy="184" r="13" fill="#19C795" stroke="#2B6D70" stroke-width="5"/>
    <circle cx="389" cy="244" r="13" fill="#14BAA0" stroke="#227583" stroke-width="5"/>
    <circle cx="361" cy="361" r="13" fill="#22C87F" stroke="#197F65" stroke-width="5"/>
    <circle cx="244" cy="361" r="13" fill="#20C786" stroke="#179276" stroke-width="5"/>
    <circle cx="217" cy="244" r="13" fill="#12C0D2" stroke="#187B8E" stroke-width="5"/>
    <circle cx="303" cy="184" r="4" fill="#0B685D"/>
    <circle cx="389" cy="244" r="4" fill="#0B685D"/>
    <circle cx="361" cy="361" r="4" fill="#0B685D"/>
    <circle cx="244" cy="361" r="4" fill="#0B685D"/>
    <circle cx="217" cy="244" r="4" fill="#0B685D"/>
  </g>

  <!-- chart bars -->
  <g stroke-linecap="round">
    <line x1="204" y1="333" x2="204" y2="369" stroke="#40506B" stroke-width="16"/>
    <line x1="235" y1="300" x2="244" y2="360" stroke="#1D8DB3" stroke-width="15"/>
    <line x1="268" y1="263" x2="268" y2="370" stroke="#0ABCE0" stroke-width="16"/>
    <line x1="300" y1="225" x2="300" y2="370" stroke="#19C98C" stroke-width="16"/>
    <line x1="317" y1="286" x2="317" y2="329" stroke="#278C7E" stroke-width="16"/>
  </g>

  <!-- dotted detail on left blue bar -->
  <g fill="#243954">
    <rect x="232" y="305" width="6" height="7" rx="2"/>
    <rect x="234" y="318" width="6" height="7" rx="2"/>
    <rect x="236" y="331" width="6" height="7" rx="2"/>
    <rect x="238" y="344" width="6" height="7" rx="2"/>
  </g>

  <!-- data lines -->
  <polyline points="217,244 291,304 389,244" fill="none" stroke="#0ABBE6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="303,184 291,304 361,361" fill="none" stroke="#19C980" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="244,361 291,304 389,244" fill="none" stroke="#0BBCE1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- central node -->
  <circle cx="291" cy="304" r="15" fill="#18C78D" opacity=".76"/>

  <!-- upward arrow / EV line -->
  <path d="M244 361 L378 190" fill="none" stroke="url(#arrowStroke)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M378 190 L422 229 L413 203 L397 205 Z" fill="#36D090"/>

  <!-- EV label -->
  <g>
    <rect x="367" y="121" width="102" height="55" rx="27.5" fill="#08312F" stroke="#20C99A" stroke-width="4"/>
    <text x="389" y="158" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#27D3A3">+</text>
    <text x="409" y="160" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" fill="#27D3A3">EV</text>
  </g>
</svg>